<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Profile Card</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        margin-top: 50px;
        background-color: #f4f4f4;
      }

      #profileCard {
        width: 300px;
        text-align: center;
        padding: 20px;
        border: 2px solid #ccc;
        border-radius: 10px;
        background-color: white;
        transition: 0.3s;
      }

      #profileImage {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
      }

      button {
        margin: 5px;
        padding: 10px;
        cursor: pointer;
      }

      /* Active status styling */
      .active-status {
        background-color: lightgreen;
        border-color: green;
      }

      #statusText {
        font-weight: bold;
        color: red;
      }

      .active-status #statusText {
        color: green;
      }
    </style>
  </head>
  <body>
    <div id="profileCard">
      <img
        id="profileImage"
        src="https://placehold.co/100x100"
        alt="Profile Image"
      />

      <h2 id="profileName">John Doe</h2>

      <p id="profileRole">Software Developer</p>

      <p id="profileBio">
        Passionate about coding and learning new technologies.
      </p>

      <p id="statusText">Inactive</p>

      <button id="updateNameBtn">Update Name</button>
      <button id="updateRoleBtn">Update Role</button>
      <button id="toggleStatusBtn">Toggle Active Status</button>
      <button id="changeImageBtn">Change Image</button>
    </div>

    <script>
      // Select elements
      const profileName = document.getElementById("profileName");
      const profileRole = document.getElementById("profileRole");
      const profileCard = document.getElementById("profileCard");
      const profileImage = document.getElementById("profileImage");
      const statusText = document.getElementById("statusText");

      const updateNameBtn = document.getElementById("updateNameBtn");
      const updateRoleBtn = document.getElementById("updateRoleBtn");
      const toggleStatusBtn = document.getElementById("toggleStatusBtn");
      const changeImageBtn = document.getElementById("changeImageBtn");

      // Task 1: Update Name
      updateNameBtn.addEventListener("click", () => {
        const newName = prompt("Enter a new name:");

        if (newName && newName.trim() !== "") {
          profileName.textContent = newName;
        }
      });

      // Task 1: Update Role
      updateRoleBtn.addEventListener("click", () => {
        const newRole = prompt("Enter a new role:");

        if (newRole && newRole.trim() !== "") {
          profileRole.textContent = newRole;
        }
      });

      // Task 2: Toggle Active Status
      toggleStatusBtn.addEventListener("click", () => {
        profileCard.classList.toggle("active-status");

        if (profileCard.classList.contains("active-status")) {
          statusText.textContent = "Active";
        } else {
          statusText.textContent = "Inactive";
        }
      });

      // Task 3: Change Profile Image
      changeImageBtn.addEventListener("click", () => {
        const newImageUrl = prompt("Enter a new image URL:");

        if (newImageUrl && newImageUrl.trim() !== "") {
          profileImage.src = newImageUrl;
        }
      });
    </script>
  </body>
</html>
